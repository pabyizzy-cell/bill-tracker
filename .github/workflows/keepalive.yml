name: Keep Supabase awake

# Free-tier Supabase projects pause after ~7 days without database activity.
# This sends a trivial read query every 3 days so the project stays active.
# The publishable key is public by design (row-level security guards the data).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -sf -o /dev/null -w "status: %{http_code}\n" \
            "https://jmxbcefszodysicrqztn.supabase.co/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: sb_publishable_SmTIP8KaFZZY6TgM8D8abA_oGrbIHqn" \
            -H "Authorization: Bearer sb_publishable_SmTIP8KaFZZY6TgM8D8abA_oGrbIHqn"
